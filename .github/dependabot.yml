# Atualizacoes semanais em PRs agrupados, com titulo no padrao do repositorio.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # eslint e @eslint/js tem a mesma major: subir separados quebra o lint.
      eslint:
        patterns: [eslint, '@eslint/js']
      producao:
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
    # Majors que quebram o lint ou fogem do runtime. Liberar quando o
    # ecossistema acompanhar (conferir os peerDependencies citados).
    ignore:
      # typescript-eslint aceita typescript <6.1.0.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Os tipos acompanham o Node das imagens (24).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  # A action composta (.github/actions/preparar) tambem usa actions de terceiros.
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build(deps)
    # Node so muda de major junto com o .github/actions/preparar e o Dockerfile.dev.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
