name: CodeQL

# Analise estatica de seguranca. O ruleset da main barra o merge se houver
# alerta de severidade alta ou maior.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '30 9 * * 1'

permissions:
  contents: read

jobs:
  analisar:
    name: Analise CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
