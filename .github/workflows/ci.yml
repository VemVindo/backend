name: CI/CD

# PR para a main: valida tudo e publica o relatorio; nada e publicado.
# Push na main: valida, publica a imagem no GHCR, faz o deploy no Render e
# guarda a cobertura como referencia para os proximos PRs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Um push novo no mesmo PR cancela a execucao antiga. Na main nada e
# cancelado, para nao interromper um deploy no meio.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint e formatacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar
      - run: npm run lint:check
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar
      - run: npm run typecheck

  testes:
    name: Testes unitarios e cobertura
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar

      # Falha se algum teste falhar ou se alguma metrica de cobertura ficar abaixo
      # do coverageThreshold do package.json.
      - name: Testes com cobertura
        run: npm run test:ci

      # Referencia: cobertura do ultimo push verde na main.
      - name: Baixar cobertura da main
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name cobertura-main --dir baseline
          fi

      - name: Cobertura nao pode cair mais de 1 ponto
        if: github.event_name == 'pull_request'
        run: >
          node scripts/ci/relatorio.mjs cobertura
          --atual coverage/coverage-summary.json
          --base baseline/coverage-summary.json
          --max-queda 1

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-testes
          path: |
            reports/
            coverage/coverage-summary.json
            baseline/
          retention-days: 7

      - name: Guardar cobertura da main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-main
          path: coverage/coverage-summary.json
          retention-days: 90

  e2e:
    name: Testes e2e e de API
    runs-on: ubuntu-latest
    # Banco descartavel, so para o teste. Nada aqui e segredo.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vemvindo_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d vemvindo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/vemvindo_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/vemvindo_ci
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/vemvindo_ci
      JWT_SECRET: segredo-de-teste-do-ci-com-mais-de-32-caracteres
      PORT: '3000'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar

      # Prova que as migrations sobem num banco limpo e que o seed roda.
      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Seed de dev
        run: npm run db:seed

      - name: Subir a API
        run: |
          npm run build
          nohup node dist/main > api.log 2>&1 &
          curl --silent --fail --retry 30 --retry-connrefused --retry-delay 1 \
            http://localhost:3000/health/db

      # A colecao do Postman passa por todas as rotas e e informativa: uma
      # falha aparece no resumo do job, mas nao bloqueia o merge.
      - name: Testes de API (Postman)
        id: postman
        continue-on-error: true
        run: |
          mkdir -p reports
          npx newman run test/postman/*.postman_collection.json \
            --env-var baseUrl=http://localhost:3000 \
            --reporters cli,json,junit \
            --reporter-json-export reports/newman.json \
            --reporter-junit-export reports/newman-junit.xml

      # Cada suite cria um schema proprio, aplica as migrations nele e o apaga no fim.
      - name: Testes de integracao (Jest)
        run: npm run test:integration

      - name: Testes e2e (Jest)
        run: npm run test:e2e

      - name: Log da API
        if: failure() || steps.postman.outcome == 'failure'
        run: cat api.log || true

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-e2e
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  migrations:
    name: Schema e migrations em sincronia
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vemvindo_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d vemvindo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIRECT_URL: postgresql://ci:ci@localhost:5432/vemvindo_ci
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      # Sai com codigo 2 se o schema.prisma tem mudanca sem migration.
      - name: Conferir drift
        run: |
          npx prisma migrate diff --from-config-datasource \
            --to-schema prisma/schema.prisma --exit-code || {
            echo "::error::schema.prisma mudou sem migration. Rode: npx prisma migrate dev --name <descricao>"
            exit 1
          }

  seguranca:
    name: Seguranca de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Bloqueia vulnerabilidade alta ou critica no que vai para producao.
      # Dependencias de desenvolvimento ficam de fora porque nao entram na imagem.
      - name: Auditoria de dependencias de producao
        run: npm audit --omit=dev --audit-level=high

      # So no PR: barra dependencia nova com vulnerabilidade alta ou licenca
      # que nao permite uso comercial.
      - name: Revisao de dependencias do PR
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  imagem:
    name: Imagem Docker
    needs: [lint, typecheck, testes, e2e, migrations, seguranca]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagem: ${{ steps.nome.outputs.imagem }}
    steps:
      - uses: actions/checkout@v7

      # O GHCR exige nome em minusculas (VemVindo -> vemvindo).
      - name: Nome da imagem
        id: nome
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Primeiro build local, so para a varredura.
      - name: Build para varredura
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: vemvindo-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Falha em vulnerabilidade CRITICAL que ja tem correcao publicada.
      - name: Varredura da imagem (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        # So a tabela dos achados, sem o resumo de cada package.json da imagem.
        env:
          TRIVY_TABLE_MODE: detailed
          TRIVY_SKIP_VERSION_CHECK: 'true'
          TRIVY_DISABLE_VEX_NOTICE: 'true'
        with:
          image-ref: vemvindo-backend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.nome.outputs.imagem }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mesmo build (vem do cache), agora publicado com SBOM e proveniencia.
      - name: Publicar no GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          provenance: true
          sbom: true

  # Unico check do CI exigido pelo ruleset da main: assim, adicionar ou
  # renomear um job nao exige mexer na protecao da branch.
  ci-ok:
    name: CI ok
    needs: [lint, typecheck, testes, e2e, migrations, seguranca, imagem]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Conferir os jobs
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for resultado in $RESULTADOS; do
            if [ "$resultado" != success ]; then
              echo "::error::Algum job obrigatorio terminou como $resultado"
              exit 1
            fi
          done

  relatorio:
    name: Relatorio
    needs: [lint, typecheck, testes, e2e, migrations, seguranca, imagem]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      # Um download por artifact, cada um na sua pasta. Com "pattern", um
      # artifact sozinho e extraido sem a subpasta e os caminhos mudam.
      - name: Baixar resultados dos testes
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: resultados-testes
          path: resultados/testes

      - name: Baixar resultados do e2e
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: resultados-e2e
          path: resultados/e2e

      - name: Montar resumo
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >
          node scripts/ci/relatorio.mjs resumo
          --projeto backend
          --etapas "$NEEDS"
          --testes resultados/testes/reports/jest-results.json
          --cobertura resultados/testes/coverage/coverage-summary.json
          --base resultados/testes/baseline/coverage-summary.json
          --api resultados/e2e/newman.json
          --saida relatorio.md

      # PR de fork recebe token so de leitura: o relatorio fica so no resumo.
      - name: Comentario no PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ci-backend
          path: relatorio.md

      - name: Testes com anotacoes
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: dorny/test-reporter@v3
        with:
          name: Testes unitarios (detalhe)
          path: resultados/testes/reports/junit.xml
          reporter: jest-junit
          fail-on-error: false
          fail-on-empty: false

  deploy:
    name: Deploy no Render
    needs: [imagem, ci-ok]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Sobe exatamente a imagem testada neste commit, e nao "a ultima".
      # As migrations rodam no CMD da imagem quando o container novo sobe.
      - name: Disparar deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGEM: ${{ needs.imagem.outputs.imagem }}:sha-${{ github.sha }}
        run: |
          curl --fail --silent --show-error --get \
            --data-urlencode "imgURL=${IMAGEM}" \
            "${RENDER_DEPLOY_HOOK}"

      # O Render leva alguns minutos para trocar o container: tenta por ate 10 min.
      - name: Smoke test
        env:
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
        run: |
          if [ -z "$API_PUBLIC_URL" ]; then
            echo "::warning::Defina a variavel API_PUBLIC_URL para conferir o deploy."
            exit 0
          fi
          for tentativa in $(seq 1 40); do
            if curl --silent --fail "$API_PUBLIC_URL/health/db" | grep -q '"up"'; then
              echo "API respondendo com o banco up."
              exit 0
            fi
            sleep 15
          done
          echo "::error::A API nao respondeu em $API_PUBLIC_URL/health/db. Faca rollback pelo Render para o deploy anterior."
          exit 1
