services:
  nestjs-prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: vemvindo-backend:prod
    container_name: vemvindo-backend-prod
    # Opt-in: so sobe com --profile prod ou nomeando o servico. Fora do "up" padrao.
    profiles: ["prod"]
    # Producao usa o Supabase: as variaveis vem de um .env local (nao commitado).
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:3000"

  nestjs-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: vemvindo-backend:dev
    container_name: vemvindo-backend-dev
    # Desenvolvimento usa o Postgres local do servico "database".
    # DATABASE_URL: conexao de runtime. DIRECT_URL: migrations do Prisma.
    environment:
      DATABASE_URL: postgresql://vemvindo:tppe2026.1@database:5432/vemvindo
      DIRECT_URL: postgresql://vemvindo:tppe2026.1@database:5432/vemvindo
      JWT_SECRET: dev-jwt-secret-nao-usar-em-producao
      JWT_EXPIRES_IN: "1d"
      WATCHPACK_POLLING: "true"
    ports:
      - "8000:3000"
    depends_on:
      database:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

  database:
    image: postgres:18-alpine
    container_name: vemvindo-database
    environment:
      POSTGRES_DB: vemvindo
      POSTGRES_USER: vemvindo
      POSTGRES_PASSWORD: tppe2026.1
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vemvindo -d vemvindo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
